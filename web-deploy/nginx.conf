# StockFlow Web — nginx config for a Flutter SPA.
# SPA fallback to index.html so deep links (e.g. /payments/details)
# resolve correctly on refresh.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Content-hashed assets: safe to cache immutably ────────────
    # Flutter names everything under assets/ (and canvaskit/) with
    # content hashes, so these never change in place across deploys.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /canvaskit/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* \.(?:png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Unhashed entrypoints: must revalidate on every deploy ─────
    # main.dart.js / flutter_bootstrap.js / flutter.js are NOT
    # content-hashed by Flutter — immutable caching would serve a stale
    # app for up to 30 days after a release. no-cache → browser keeps
    # them cached but revalidates (304) so a new deploy is picked up.
    location = /main.dart.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /flutter.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /version.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ── SPA fallback — all other paths serve index.html ───────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
