# ═══════════════════════════════════════════════════════════════
# StockFlow Enterprise — Security Scanning Pipeline
# ═══════════════════════════════════════════════════════════════
# Runs on every pull request and weekly on main.
#
# Stages:
#   1. Gitleaks — secret scanning
#   2. CodeQL — code quality / vulnerability analysis
#   3. Trivy — Docker image vulnerability scan
#   4. CycloneDX SBOM — software bill of materials generation
#   5. License checker — dependency license compliance
#   6. npm audit — known vulnerability check (high+critical)
#
# ═══════════════════════════════════════════════════════════════

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  WORKING_DIR: ./backend

defaults:
  run:
    working-directory: ./backend

jobs:
  # ═══════════════════════════════════════════════════════════════
  # SECRETS SCAN — Gitleaks
  # ═══════════════════════════════════════════════════════════════
  secrets-scan:
    name: '🔑 Secrets Scan (Gitleaks)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════
  # CODEQL — SAST
  # ═══════════════════════════════════════════════════════════════
  codeql:
    name: '🔬 CodeQL Analysis'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          output: codeql-results
          upload: true

  # ═══════════════════════════════════════════════════════════════
  # DEPENDENCY AUDIT — npm audit + cyclonedx SBOM
  # ═══════════════════════════════════════════════════════════════
  dependency-audit:
    name: '📦 Dependency Audit'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.WORKING_DIR }}

      # - npm audit with .nsprc suppressions
      - name: npm audit (high+critical)
        run: npm audit --audit-level=high
        working-directory: ${{ env.WORKING_DIR }}
        continue-on-error: true

      # - Generate CycloneDX SBOM
      - name: Generate SBOM (CycloneDX)
        run: |
          npx -p @cyclonedx/cyclonedx-npm cyclonedx-npm --output ../sbom.json
        working-directory: ${{ env.WORKING_DIR }}
        continue-on-error: true

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90
          if-no-files-found: ignore

      # - License compliance check
      - name: License Check
        run: |
          npx license-checker --production --excludePrivatePackages --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;Unlicense;CC0-1.0;0BSD" \
            --summary 2>&1 || echo "⚠️ License check warnings (non-blocking)"
        working-directory: ${{ env.WORKING_DIR }}
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  # CONTAINER SCAN — Trivy (after Docker build)
  # ═══════════════════════════════════════════════════════════════
  container-scan:
    name: '🐳 Container Vulnerability Scan (Trivy)'
    runs-on: ubuntu-latest
    needs: [secrets-scan, codeql, dependency-audit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t stockflow-backend:${{ github.sha }} .
        working-directory: ${{ env.WORKING_DIR }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: stockflow-backend:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy
          wait-for-processing: true
