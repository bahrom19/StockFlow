# ═══════════════════════════════════════════════════════════════
# StockFlow Enterprise — Flutter Web Deployment
# ═══════════════════════════════════════════════════════════════
# Single self-contained job: analyze → test → build the Flutter web
# app → copy mobile/build/web into the Docker build context
# (web-deploy/html) → `railway up` → generate the public domain.
#
# Building and staging happen in the SAME job so the Docker context is
# guaranteed to contain html/ — no cross-job artifact round-trip that
# can silently lose the build output.
#
# Secret (one-time provisioning, see docs/DEPLOYMENT_GUIDE.md §6):
#   RAILWAY_TOKEN — Railway account token
#
# The service is targeted BY NAME (`stockflow-web`), so no service-id
# secret is required — Railway CLI resolves names to the service in the
# linked project.
#
# The deploy step is guarded: without RAILWAY_TOKEN the workflow still
# builds and reports green (deploy is skipped with a notice).
# ═══════════════════════════════════════════════════════════════

name: Web Deploy

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'web-deploy/**'
      - '.github/workflows/web-deploy.yml'
  workflow_dispatch:

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.24.5'
  RAILWAY_SERVICE_NAME: 'stockflow-web'

jobs:
  # ─────────────────────────────────────────────────────────────
  # BUILD + DEPLOY — one job so html/ is always in the context
  # ─────────────────────────────────────────────────────────────
  build-and-deploy:
    name: '🌐 Build & Deploy Flutter Web'
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get
        working-directory: mobile

      # Fail on errors only. The committed tree carries pre-existing
      # warning-level lints in modules owned by in-flight workstreams
      # (they are fixed in the working tree); a deploy pipeline must not
      # be blocked by unrelated warnings, only by real compile errors.
      - name: Static analysis (errors only)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
        working-directory: mobile

      - name: Run tests
        run: flutter test
        working-directory: mobile

      - name: Build web release
        run: flutter build web --release
        working-directory: mobile

      # The Flutter build output lives at mobile/build/web/. Copy it
      # into the Docker build context (web-deploy/html/) IN THIS JOB so
      # the Dockerfile `COPY html/ ...` always finds it. html/ must NOT
      # be git-ignored: the Railway CLI filters git-ignored files out of
      # the upload snapshot, which would silently break the Docker build
      # (COPY html/ not found). The assertion below fails loudly instead.
      - name: Stage build into Docker context
        run: |
          rm -rf web-deploy/html
          mkdir -p web-deploy/html
          cp -r mobile/build/web/. web-deploy/html/
          echo "✓ staged $(ls web-deploy/html | wc -l | tr -d ' ') top-level assets"
          test -f web-deploy/html/index.html && echo "✓ index.html present"
          test -f web-deploy/html/main.dart.js && echo "✓ main.dart.js present"
          if git check-ignore web-deploy/html/index.html >/dev/null 2>&1; then
            echo "::error::web-deploy/html is git-ignored - Railway will not upload it (COPY html/ will fail). Remove it from .gitignore."
            exit 1
          fi
          echo "✓ html/ not git-ignored - Railway snapshot will include it"

      # Deploy via the official Railway CLI from npm (no third-party
      # action dependency). Targets the service BY NAME — the CLI
      # resolves `--service stockflow-web` against the linked project.
      # Runs from web-deploy/ which holds the nginx Dockerfile +
      # staged html/. Guarded by the step-level env check so the
      # workflow stays green before the Railway token is set.
      - name: Deploy to Railway
        if: env.RAILWAY_TOKEN != ''
        working-directory: web-deploy
        run: npx --yes @railway/cli@latest up --service "$RAILWAY_SERVICE_NAME" --ci

      # `railway up` never exposes a service publicly on its own — a
      # domain must be generated explicitly. Idempotent: Railway allows
      # one *.up.railway.app domain per service, so repeat runs simply
      # confirm/return the existing domain.
      - name: Generate public domain
        if: env.RAILWAY_TOKEN != ''
        working-directory: web-deploy
        run: npx --yes @railway/cli@latest domain --service "$RAILWAY_SERVICE_NAME"

      # Mandatory verification: the deploy is only green if the public
      # URL actually serves the app. Railway can report a successful
      # build while the service still has no live deployment (or an old
      # failed one); this step fails the run loudly in that case.
      - name: Verify public URL
        if: env.RAILWAY_TOKEN != ''
        working-directory: web-deploy
        run: |
          WEB_URL=$(npx --yes @railway/cli@latest domain list --service "$RAILWAY_SERVICE_NAME" \
            | grep -oE 'https://[a-z0-9-]+\.up\.railway\.app' | head -1)
          echo "Web URL: $WEB_URL"
          test -n "$WEB_URL" || { echo '::error::no public domain found'; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$WEB_URL/")
          echo "index: $code"
          test "$code" = "200" || { echo "::error::index returned $code"; exit 1; }
          fallback=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$WEB_URL/pos")
          echo "spa fallback: $fallback"
          test "$fallback" = "200" || { echo "::error::spa fallback returned $fallback"; exit 1; }
          echo "✅ Flutter web live at $WEB_URL"

      - name: Notify deploy URL
        if: env.RAILWAY_TOKEN != ''
        working-directory: web-deploy
        run: |
          echo "✅ Flutter web deployed via service $RAILWAY_SERVICE_NAME"
          echo "   Public URL:"
          npx --yes @railway/cli@latest domain list --service "$RAILWAY_SERVICE_NAME" | tail -5
