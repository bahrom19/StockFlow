# ═══════════════════════════════════════════════════════════════
# StockFlow Enterprise — Production CD Pipeline
# ═══════════════════════════════════════════════════════════════
# Triggered by push to main AFTER CI passes.
#
# Stages:
#   1. Build Docker image
#   2. Push to GitHub Container Registry
#   3. Deploy to Staging
#   4. Smoke tests against Staging
#   5. Manual approval gate
#   6. Deploy to Production
#   7. Smoke tests against Production
#   8. Auto-rollback on failure
#
# ═══════════════════════════════════════════════════════════════

name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TAG: ${{ github.sha }}
  NODE_VERSION: '22'
  WORKING_DIR: ./backend

defaults:
  run:
    working-directory: ./backend

jobs:
  # ═══════════════════════════════════════════════════════════════
  # 1. BUILD & PUSH DOCKER IMAGE
  # ═══════════════════════════════════════════════════════════════
  build-and-push:
    name: '🐳 Build & Push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
      image-latest: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (labels, tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKING_DIR }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # ═══════════════════════════════════════════════════════════════
  # 2. DEPLOY STAGING
  # ═══════════════════════════════════════════════════════════════
  deploy-staging:
    name: '🚀 Deploy Staging'
    needs: [build-and-push]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    environment:
      name: staging
      url: https://stockflow-production-04c7.up.railway.app

    steps:
      - name: Deploy to Staging
        run: |
          echo "🚀 Deploying ${{ needs.build-and-push.outputs.image }} to Staging..."
          # Replace with actual deployment command:
          # kubectl set image deployment/stockflow-backend \
          #   app=${{ needs.build-and-push.outputs.image }} \
          #   -n stockflow-staging
          echo "✅ Staging deployment initiated"

      - name: Wait for deployment
        run: |
          echo "⏳ Waiting for Staging deployment to stabilize..."
          # Replace with actual rollout status check:
          # kubectl rollout status deployment/stockflow-backend \
          #   -n stockflow-staging --timeout=300s
          sleep 10
          echo "✅ Staging deployment stable"

  # ═══════════════════════════════════════════════════════════════
  # 3. SMOKE TESTS (Staging)
  # ═══════════════════════════════════════════════════════════════
  smoke-tests:
    name: '🧪 Smoke Tests'
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Health check
        run: |
          echo "🔍 Running health check against Staging..."
          curl -sSf --max-time 10 \
            https://stockflow-production-04c7.up.railway.app/api/health || exit 1
          echo "✅ Health check passed"

      - name: Liveness probe
        run: |
          curl -sSf --max-time 10 \
            https://stockflow-production-04c7.up.railway.app/api/health/live || exit 1
          echo "✅ Liveness probe passed"

      - name: Readiness probe
        run: |
          curl -sSf --max-time 10 \
            https://stockflow-production-04c7.up.railway.app/api/health/ready || exit 1
          echo "✅ Readiness probe passed"

      - name: API smoke test (auth + products + health)
        run: |
          # Simple smoke test to verify core API is operational
          echo "🔍 Running API smoke tests..."
          # Test auth
          AUTH_RESP=$(curl -sS --max-time 10 \
            -X POST https://stockflow-production-04c7.up.railway.app/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"test@stockflow.com","password":"test123"}')
          echo "Auth response: $(echo $AUTH_RESP | head -c 100)"
          echo "✅ Smoke tests completed"

      - name: Metrics endpoint
        run: |
          curl -sSf --max-time 10 \
            https://stockflow-production-04c7.up.railway.app/api/health/metrics | head -c 500
          echo ""
          echo "✅ Metrics endpoint reachable"

  # ═══════════════════════════════════════════════════════════════
  # 4. APPROVAL GATE
  # ═══════════════════════════════════════════════════════════════
  approval:
    name: '✅ Manual Approval'
    needs: [smoke-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    environment:
      name: production
    steps:
      - name: Await manual approval
        run: |
          echo "⏳ Waiting for manual approval to deploy to Production..."
          echo "   Review the Staging deployment at:"
          echo "   https://stockflow-production-04c7.up.railway.app"
          echo "   "
          echo "   Approve or reject via GitHub Environments UI."
          # GitHub Actions automatically pauses for environment
          # approval when 'required reviewers' is configured.
          echo "✅ Approval step configured"

  # ═══════════════════════════════════════════════════════════════
  # 5. DEPLOY PRODUCTION
  # ═══════════════════════════════════════════════════════════════
  deploy-production:
    name: '🚀 Deploy Production'
    needs: [approval, build-and-push]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    environment:
      name: production
      url: https://stockflow-production-04c7.up.railway.app

    steps:
      - name: Deploy to Production
        run: |
          echo "🚀 Deploying ${{ needs.build-and-push.outputs.image }} to Production..."
          # Replace with actual deployment command:
          # kubectl set image deployment/stockflow-backend \
          #   app=${{ needs.build-and-push.outputs.image }} \
          #   -n stockflow-production
          echo "✅ Production deployment initiated"

      - name: Wait for deployment
        run: |
          echo "⏳ Waiting for Production deployment to stabilize..."
          # kubectl rollout status deployment/stockflow-backend \
          #   -n stockflow-production --timeout=300s
          sleep 15
          echo "✅ Production deployment stable"

  # ═══════════════════════════════════════════════════════════════
  # 6. POST-DEPLOY SMOKE TESTS (Production)
  # ═══════════════════════════════════════════════════════════════
  post-deploy-verify:
    name: '🔍 Post-Deploy Verification'
    needs: [deploy-production]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    environment: production
    steps:
      - name: Health check
        run: |
          curl -sSf --max-time 10 \
            https://stockflow-production-04c7.up.railway.app/api/health || \
            (echo "❌ Production health check failed" && exit 1)

      - name: Liveness probe
        run: |
          curl -sSf --max-time 10 \
            https://stockflow-production-04c7.up.railway.app/api/health/live || \
            (echo "❌ Production liveness probe failed" && exit 1)

      - name: Readiness probe
        run: |
          curl -sSf --max-time 10 \
            https://stockflow-production-04c7.up.railway.app/api/health/ready || \
            (echo "❌ Production readiness probe failed" && exit 1)

  # ═══════════════════════════════════════════════════════════════
  # 7. AUTO-ROLLBACK
  # ═══════════════════════════════════════════════════════════════
  rollback:
    name: '⏪ Auto-Rollback'
    if: failure()
    needs: [deploy-production, post-deploy-verify]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    environment: production
    steps:
      - name: Rollback to previous version
        run: |
          echo "⏪ Production deployment failed — initiating auto-rollback..."
          # Replace with actual rollback command:
          # kubectl rollout undo deployment/stockflow-backend \
          #   -n stockflow-production
          echo "✅ Rollback completed"

      - name: Verify rollback health
        run: |
          echo "🔍 Verifying rollback health..."
          curl -sSf --max-time 10 \
            https://stockflow-production-04c7.up.railway.app/api/health/live || \
            echo "⚠️ Rollback health check failed — manual intervention required"
          echo "✅ Rollback verification completed"

      - name: Notify failure
        run: |
          echo "📧 Notification: Deployment to Production failed."
          echo "   Rollback has been initiated automatically."
          echo "   Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
